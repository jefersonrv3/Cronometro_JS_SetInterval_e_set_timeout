<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <img id="background" src="./assets/black-white-photo-hourglass-close-up.jpg">
    <img id="mobile-background" src="./assets/bg-mobile.png">
    <div class="glass-card">
        <h1>Cronômetro</h1>
        <h2> Ponteiros sincronizados com o valor digital</h2>

        <div class="clock" id="clock">
            <div class="center-dot"></div>
            <div class="hand hand-hours" id="hand-hours"></div>
            <div class="hand hand-minutes" id="hand-minutes"></div>
            <div class="hand hand-seconds" id="hand-seconds"></div>
        </div>

        <div class="digital" id="digital">00:00:00</div>

        <div class="controls">
            <button id="btn-start">Iniciar</button>
            <button id="btn-pause">Pausar</button>
            <button id="btn-reset">Zerar</button>
        </div>

    </div>

</body>

</html>
